# ============================================================================
# Nav2 参数 — X1 真机 (FastLIO2 + Open3D ICP + VoxelLayer + MPPI)
# ============================================================================
# 传感器: /cloud_registered_body (FastLIO2, PointCloud2, body 系)
# TF 链 (真机):
#   map → odom          : open3d_loc (ICP)
#   odom → base_footprint : odom_bridge (/Odometry + body_to_footprint_z≈-1.25)
#   camera_init → body  : FastLIO2
# 与仿真差异:
#   - use_sim_time: False（真实时钟）
#   - robot_base_frame: base_footprint（tf_bridge_real 只发到 footprint）
#   - 地图: car30_real_fastlio.yaml（launch 也会传入；此处保持一致）
# 注意: ObstacleCritic 有 bug, 用 CostCritic 替代
# 安全: 导航结束须先 /stand_mode 再让 /cmd_vel 归零（nav_state_manager）
# ============================================================================

# --- AMCL (未启用; 真机用 open3d_loc) ---
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: False

# --- 行为树导航器 ---
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 20

# --- 控制器服务器 (MPPI) ---
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    odom_topic: /odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.35
      stateful: True

    # ---- RotationShimController 包装 MPPI ----
    # 目标几乎在正后方时先原地旋转，再交给 MPPI；参数沿用仿真 biped 调参
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 2.785  # ~160°
      forward_sampling_distance: 1.5
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      time_steps: 32
      model_dt: 0.1
      batch_size: 600
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.4                     # X1 真机首次联调保守上限
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 0.4                     # >0.4 易步态失稳
      iteration_count: 1
      prune_distance: 0.8
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"

      ax_max: 1.0
      ax_min: -1.0
      az_max: 1.0

      visualize: true

      critics: [
        "ConstraintCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathAngleCritic",
        "PathFollowCritic",
        "PreferForwardCritic",
        "CostCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        cost_power: 1
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_weight: 14.0
        cost_power: 1
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false
      PathAngleCritic:
        enabled: true
        cost_weight: 3.5
        cost_power: 1
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.7
        mode: 0
      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PreferForwardCritic:
        enabled: true
        cost_weight: 2.0
        cost_power: 1
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: false
        near_goal_distance: 0.5

# ==================== 局部代价地图 ====================
# VoxelLayer 高度相对 costmap global_frame(odom)：
#   FastLIO body≈Z0 时，地面≈-1.25m（odom_bridge body_to_footprint_z）
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.25
      transform_tolerance: 0.5

      plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -1.4
        z_resolution: 0.1
        z_voxels: 25                   # [-1.4, 1.1]m
        max_obstacle_height: 0.2       # ≈ 地面(-1.25)+1.45
        min_obstacle_height: -1.1      # ≈ 地面(-1.25)+0.15，跳过地面噪声
        mark_threshold: 2
        unknown_threshold: 15
        combination_method: 1
        # mark/clear 分离：近距不 raytrace，避免盲区“遗忘”障碍
        observation_sources: cloud_mark cloud_clear
        cloud_mark:
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          max_obstacle_height: 0.2
          min_obstacle_height: -1.1
          clearing: False
          marking: True
          obstacle_max_range: 5.0
          obstacle_min_range: 0.3
        cloud_clear:
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          max_obstacle_height: 0.2
          min_obstacle_height: -1.1
          clearing: True
          marking: False
          raytrace_max_range: 6.0
          raytrace_min_range: 1.2

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 3
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.7

# ==================== 全局代价地图 ====================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: false
      transform_tolerance: 0.5

      plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: -1.4
        z_resolution: 0.1
        z_voxels: 25
        max_obstacle_height: 0.2
        min_obstacle_height: -1.1
        mark_threshold: 3
        unknown_threshold: 15
        combination_method: 1
        observation_sources: pointcloud
        pointcloud:
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          max_obstacle_height: 0.2
          min_obstacle_height: -1.1
          clearing: True
          marking: True
          obstacle_max_range: 8.0
          obstacle_min_range: 0.3
          raytrace_max_range: 10.0
          raytrace_min_range: 0.8

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 3
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7

# --- 地图服务器 ---
map_server:
  ros__parameters:
    use_sim_time: False
    # navigation_real.launch.py 会传入 car30_real_fastlio.yaml；此处保持一致
    yaml_filename: "car30_real_fastlio.yaml"

# --- 全局规划器 ---
planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: True
      allow_unknown: true

# --- Lifecycle Manager ---
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    bond_timeout: 2.0

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: False
    autostart: True
    bond_timeout: 2.0
