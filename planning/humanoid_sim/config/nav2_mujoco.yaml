# ============================================================================
# Nav2 参数 — MuJoCo X1 仿真 (FastLIO2 + 3D VoxelLayer + MPPI)
# ============================================================================
# 传感器: /cloud_registered_body (FastLIO2, PointCloud2, body系)
# TF 链: map -> odom -> base_link -> lidar_link
#   - odom->base_link : sim2sim_nav.py 发布 (imu site 位置)
#   - base_link->lidar_link : sim2sim_nav.py 静态TF
#   - map->odom : FAST_LIO2 提供 (需启动 fast_lio mapping 节点)
# 里程计: sim2sim_nav.py 发布 odom→base_link TF
# 全局地图: mujoco.yaml (FAST_LIO2 建图后转换的 2D 栅格地图)
# 坐标系说明: FAST_LIO2 初始化 lidar 在 Z=0,
#   base_link(骨盆) ≈ -0.45m, 地面 ≈ -1.25m (odom系)
# 注意: ObstacleCritic 有 bug, 用 CostCritic 替代
# ============================================================================

# --- AMCL (阶段5启用, 当前由 tf_bridge 静态 map->odom 代替) ---
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/scan"               # 阶段5: pc2scan 输出
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: False
    # set_initial_pose: true            # 极其重要：启动即赋初值，防止由于等待位姿导致 TF 断裂
    # initial_pose: [0.0, 0.0, 0.0, 0.0] # 初始位姿 (x, y, z, yaw) 根据仿真起始点修改

# --- 行为树导航器 ---
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 20
    # 自定义保守 BT: Recovery 只做 [清代价地图+等待], 无 Spin/BackUp
    # (默认 BT 的 spin 0.798 rad/s 曾致人形摔倒 → FastLIO 发散, 2026-07-14)
    # 占位值 "default" 由 launch/navigation.launch.py 的 RewrittenYaml 改写为
    # 安装目录下的绝对路径 (yaml 不支持包路径替换)
    default_nav_to_pose_bt_xml: "default"

# --- 控制器服务器 (MPPI) ---
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0   # 回滚 5Hz 实验 (33141447677 回归: B-F 启动即 FAILED_6)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # MPPI 无法生成无碰轨迹时必须立即停下并交给 BT 恢复。继续沿用旧控制
    # 2s 会让人形机器人在 cbox3 前开环前进，CI 已复现“optimizer fail → 碰撞”。
    failure_tolerance: 0.0
    odom_topic: /odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10     # RL 低速时缓慢挪动也算有进度
      movement_time_allowance: 30.0      # 20→30s: RL 跟踪带宽低, 起步/转向慢, 避免误判停滞

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20            # 严格验收: 测试判据 |err|≤0.25m, Nav2 停车须更紧
      yaw_goal_tolerance: 0.35
      stateful: True

    # ---- RotationShimController 包装 MPPI ----
    # 目标在身后时：检测机器人朝向与路径角度差，超过 angular_dist_threshold 先原地旋转对齐，再交给 MPPI
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 2.785  # 回滚 0.9 实验 (33142518306: 碰撞回归 6 次 vs 基线零, A/B 绕圈依旧) — 最终钉在 89434c4 基线配置 (双零摔倒/碰撞)。步态曲率边界的正解在 motion_control 侧 (见 doc 终局裁定)
      forward_sampling_distance: 1.5   # 0.5 → 1.5：目标在身后时路径弯曲，0.5m采样点角度不稳定，扩大采样距离使 Shim 触发更可靠
      rotate_to_heading_angular_vel: 0.3   # 低于 wz_max: 原地旋转更保守
      max_angular_accel: 0.8               # 2.0→0.8: 旋转加速度与人形步态匹配
      simulate_ahead_time: 1.0
      time_steps: 32            # ×model_dt 0.2 = 6.4s 视界, 覆盖 ~9 个步态周期
      model_dt: 0.1                   # 回滚 0.2 实验; 与 10Hz 控制周期匹配
      batch_size: 600
      vx_std: 0.15
      vy_std: 0.0                     # 差速模型不需要 Y 方向采样
      wz_std: 0.25              # 0.30→0.25: 再降旋转采样方差 — 急转机动是摔倒主因 (D 场景 vmax 1.0+, 物理崩坏)
      vx_max: 0.32                    # 0.4→0.32: 机动降速 — 避障急转时低动能, 步态稳定裕度更大 (33059189624/33132248275: 摔倒均发生在机动段)
      vx_min: 0.0                     # 人形后退不稳, 禁止倒车采样
      vy_max: 0.0
      wz_max: 0.30                    # 0.35→0.30: 摔倒链遏制 — 持续 |wz|≥0.35 机动下人形步态失稳
      iteration_count: 2              # 1→2: 提高收敛质量, 减少起步阶段指令抖动(0/饱和交替)
      prune_distance: 0.8
      transform_tolerance: 0.5        # 增大(原0.1), 适配低RTF下TF延迟
      temperature: 0.3               # 降低探索随机性，提高路径跟随精度
      gamma: 0.015
      motion_model: "DiffDrive"

      # 加速度限制 — 人形机器人保守设置
      ax_max: 1.0  #1.5
      ax_min: -1.0
      az_max: 1.0

      visualize: true

      # 评分标准 — 不用 ObstacleCritic(有bug), 用 CostCritic 替代
      critics: [
        "ConstraintCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathAngleCritic",
        "PathFollowCritic",
        "PreferForwardCritic",
        "CostCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        cost_power: 1
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_weight: 14.0
        cost_power: 1
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false
      PathAngleCritic:
        enabled: true
        cost_weight: 3.5            # 引导转向方向与路径前进方向一致，防止选错转向 3.0
        cost_power: 1
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.55 # ~32°: 更早缓转介入, 避免误差累积到 40° 后需要急转 (急转=摔倒风险)
        mode: 0                     # forward_preference：差速驱动前向优先
      PathFollowCritic:
        enabled: true
        cost_weight: 8.0            # 5→8: 抗打转 — A 场景 86s 原地绕圈 (Failed to make progress), 加强沿路径推进引力
        cost_power: 1
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PreferForwardCritic:
        enabled: true
        cost_weight: 2.0             # 8.0 → 2.0：Shim 已处理初始旋转，无需过强限制
        cost_power: 1
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0          # 回滚 7.5 实验 (REJECTED 全场景爆发; 减少变量, 保留定点绕行 waypoints)            # 3.5→6.0: 避障主导权 — A/B 绕障途中碰撞+超时, 绕行优先于推进
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: false
        near_goal_distance: 0.5

# ==================== 局部代价地图 ====================
# VoxelLayer 直接消费 FastLIO2 3D 点云, 保留高度信息
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # X1 躯干虽约 0.45m 宽，但行走摆臂/摆腿后的碰撞包络更大。
      # 0.25m 会允许 MPPI 在 cbox3 等箱体边缘切角，实测已发生接触。
      robot_radius: 0.30
      transform_tolerance: 0.5   # 允许TF时间戳偏差，防止点云被丢弃

      # 静态层保证 XML/PGM 中的固定障碍始终进入局部控制；VoxelLayer
      # 只负责运行时点云障碍，不能作为固定纸箱/墙体的唯一来源。
      plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        subscribe_to_updates: True

      # 3D 体素层: 订阅 FastLIO2 去畸变体系点云
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True        # 调试时开启, RViz 中可看 3D 体素
        origin_z: -1.4                 # MuJoCo: lidar在odom Z=0, base_link≈-0.45m, 地面≈-1.25m
        z_resolution: 0.1
        # nav2_costmap_2d::VoxelLayer 的当前实现最多支持 16 层；25 会在
        # 启动时输出错误并使局部障碍层行为不可靠。范围 [-1.4, 0.2]m
        # 与下方 max_obstacle_height=0.2m 一致。
        z_voxels: 16
        max_obstacle_height: 0.2       # 0.2m ≈ 地面(-1.25m)+1.45m障碍物顶部
        min_obstacle_height: -1.1      # -1.0m ≈ 地面(-1.25m)+0.25m，跳过地面噪声
        mark_threshold: 2              # # 体素列中至少 2 个点才标记障碍（单个散射噪点不再触发）
        unknown_threshold: 15
        combination_method: 1          # 1=overwrite, 每次更新直接覆盖而非累积
        # 标记和清除分离：防止盲区内 raytrace 清除已标记的近距离障碍体素
        # cloud_mark : 仅标记，从 0.3m 起（Mid360 物理盲区边界）
        # cloud_clear: 仅清除，从 0.8m 起（机器人贴近障碍时不清除体素，防止"遗忘"）
        observation_sources: cloud_mark cloud_clear
        cloud_mark:
          topic: /cloud_registered_body_fresh
          data_type: "PointCloud2"
          # 观测时间戳容忍: FastLIO 点云 stamp=lidar_end_time (处理延迟+
          # RTF<1 积压), 与 TF 缓存窗口错位导致 "Message Filter dropping
          # message: frame body ... earlier than all data in transform cache"
          # — 观测全丢 → 局部 costmap 对动态障碍失明 (CI 943ff27: 每场景
          # 1 次碰撞 + A 场景 86.7s 绕圈)。2s 等待窗口覆盖实测最大抖动
          # (Odometry hz min 0.05s max 0.86s)。
          transform_tolerance: 2.0
          max_obstacle_height: 0.2
          min_obstacle_height: -1.1
          clearing: False
          marking: True
          obstacle_max_range: 7.0   # 5→7: 动态障碍更早进局部图 (提前绕行)
          obstacle_min_range: 0.3
        cloud_clear:
          topic: /cloud_registered_body_fresh
          data_type: "PointCloud2"
          transform_tolerance: 2.0
          max_obstacle_height: 0.2
          min_obstacle_height: -1.1
          clearing: True
          marking: False
          raytrace_max_range: 6.0
          raytrace_min_range: 1.2     # 仅在 0.8m 以外执行清除，盲区内不清除

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 3          # 默认值
        group_connectivity_type: 8     # 默认值，推荐

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5      # 降低梯度陡峭度，防止MPPI在狭窄通道产生高频振荡wz指令导致摔倒
        inflation_radius: 0.55        # 0.7→0.55: 通道A物理宽1.0m (robot_radius 0.30 → lethal 后余 0.4m);
                                     # 旧静态地图通道被画窄 0.3m (已重生成修复); 0.55 恢复合理走廊

# ==================== 全局代价地图 ====================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: false
      transform_tolerance: 0.5   # 允许TF时间戳偏差，防止点云被丢弃

      plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer"]

      # 静态地图层 (mujoco.yaml: FAST_LIO2 建图后用 octomap/pcd2pgm 转换)
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # 3D 体素层: 实时障碍物检测，使全局规划器感知动态障碍物，避免规划穿越已被堵住的通道
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: -1.4
        z_resolution: 0.1
        # 与局部 VoxelLayer 一致；当前实现最多支持 16 层。
        z_voxels: 16
        max_obstacle_height: 0.2
        min_obstacle_height: -1.0
        mark_threshold: 3          # 2→3：提高噪点过滤门槛，减少全局代价地图噪点
        unknown_threshold: 15
        combination_method: 1
        observation_sources: pointcloud
        pointcloud:
          topic: /cloud_registered_body_fresh
          data_type: "PointCloud2"
          transform_tolerance: 2.0     # 同 local cloud_mark — TF/点云时间戳错位容忍
          max_obstacle_height: 0.2
          min_obstacle_height: -1.0
          clearing: True
          marking: True
          obstacle_max_range: 8.0
          obstacle_min_range: 0.3
          raytrace_max_range: 10.0
          raytrace_min_range: 0.8      # 防止近距离射线清除墙体体素引发重规划恶性循环

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 3
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55       # 与局部 inflation 一致, 消除全局/局部可行域分裂

# --- 地图服务器 ---
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "mujoco_lab.yaml"         # FAST_LIO2 建图后转换的 2D 栅格地图

# --- 全局规划器 ---
planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      # 最终回滚到 NavFn (33147080499: Smac Hybrid DUBIN 在此图上 1e6 迭代
      # 搜不出路径 — 通道A 1.0m 宽 vs 1.4m 最小转弯半径, 混合A*的角度离散
      # 在窄通道内组合爆炸; NavFn 网格最短路无此限制且 A/B 曾走到中途)。
      # 曲率不可行问题已知: A 场景大航向差由 RotationShim(0.9rad 原地转)
      # + MPPI 缓行转向承担; 入口急转点的步态曲率边界问题留档 doc 后记,
      # 正解需步态侧转向能力 (motion_control, 本轮禁区)。
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.75             # 0.5→0.75: goal 附近被膨胀/体素污染时仍可提取路径
                                  # (NavFn 'legal potential was found' 提取失败 bug 缓解)
      use_astar: True
      allow_unknown: true


